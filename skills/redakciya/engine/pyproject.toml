[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6", "pillow>=10", "playwright>=1.45"]

[project.optional-dependencies]
telethon = ["telethon>=1.36"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["rk*"]
